# PostgreSQL à la place de SQLite. S'ajoute à docker-compose.yml, seulement si
# .env contient COMPOSE_FILE=docker-compose.yml:docker-compose.postgres.yml
# (marche à suivre : README, « Passer de SQLite à PostgreSQL »).
#
# La base n'est joignable que par l'application : aucun port n'est publié.
# Version majeure fixée : la changer demande de migrer le dossier data/postgres,
# une mise à jour automatique ne doit jamais le faire.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manque dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manque dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manque dans .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  quizscan:
    depends_on:
      db:
        condition: service_healthy
