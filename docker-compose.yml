services:
  quizscan:
    build: .
    # QUIZSCAN_BIND (.env) : 127.0.0.1 par défaut — l'application n'est
    # joignable que depuis le serveur, un reverse proxy (Caddy) la publie.
    # Mettez 0.0.0.0 pour un accès direct depuis le réseau, par exemple
    # QUIZSCAN_BIND=0.0.0.0 et QUIZSCAN_PORT=80.
    ports:
      - "${QUIZSCAN_BIND:-127.0.0.1}:${QUIZSCAN_PORT:-5011}:8000"
    # Réglages propres au serveur : fichier .env (copie de .env.example),
    # jamais versionné, donc conservé lors des mises à jour automatiques.
    env_file: .env
    environment:
      DEBUG: "0"
      POSTGRES_HOST: db
    volumes:
      - ./data:/app/data     # cache, sauvegardes
      - ./media:/app/media   # fiches PDF, scans, images de contrôle
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # La base n'est joignable que par l'application : aucun port n'est publié.
  # Version majeure fixée : la changer demande de migrer data/postgres, une mise
  # à jour automatique ne doit jamais le faire.
  db:
    image: postgres:17
    # Mémoire de PostgreSQL pour un serveur de 16 Go partagé avec d'autres services.
    # Ses valeurs d'origine visent une toute petite machine : 128 Mo de cache, 4 Mo pour
    # trier, au-delà de quoi les gros calculs (résultats et tableau de bord d'un concours
    # de 10 000 copies) passent par le disque. À ajuster dans .env (PG_…) ; un changement
    # redémarre la base une fois, à la mise à jour suivante.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-256MB}
    # mémoire partagée des requêtes en parallèle : 64 Mo par défaut dans Docker, trop peu
    shm_size: 512mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizscan}
      POSTGRES_USER: ${POSTGRES_USER:-quizscan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?manque dans .env - lancez sh deploy/passer_a_postgres.sh}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
