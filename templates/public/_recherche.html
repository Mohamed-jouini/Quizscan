{# Champ « n° d'inscription » de l'espace public (accueil et page des résultats). #}
<form class="pub-recherche" method="get" action="{% url 'public_resultat' %}" role="search">
  <label for="id_numero" class="visually-hidden">N° d'inscription</label>
  <span class="pub-recherche__champ">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
    <input id="id_numero" type="search" name="numero" value="{{ numero|default:'' }}" inputmode="numeric"
           autocomplete="off" placeholder="Votre n° d'inscription" required>
  </span>
  <button class="btn" type="submit">Voir mes résultats</button>
</form>
